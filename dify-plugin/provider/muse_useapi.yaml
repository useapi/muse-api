identity:
  author: useapi
  name: muse_useapi
  label:
    en_US: Meta Muse by useapi.net
    zh_Hans: Meta Muse，由 useapi.net 提供
    ja_JP: Meta Muse by useapi.net
    pt_BR: Meta Muse por useapi.net
  description:
    en_US: 'Meta Muse in Dify: videos of about 10 seconds with sound (from text, a photo that can speak a line, or a video to edit), images from text or up to 9 input images, and chat with the Muse agent, on your own Muse account (the free plan works). Connect several Muse accounts: with the email left empty, useapi.net picks a healthy one with allowance left. Third-party API by useapi.net, not affiliated with Meta. Needs a useapi.net subscription ($15/month) and a Muse account at muse.ai, created in the US, Canada, Japan, Singapore or Australia.'
    zh_Hans: 在 Dify 中使用 Meta Muse：约 10 秒的有声视频（基于文本、可说台词的照片，或编辑已有视频），基于文本或最多 9 张输入图片生成图片，以及与 Muse 智能体对话，全部在你自己的 Muse 账号上运行（免费方案即可）。可连接多个 Muse 账号：邮箱留空时，useapi.net 会选择健康且有剩余额度的账号。由 useapi.net 提供的第三方 API，与 Meta 无关联。需要 useapi.net 订阅（每月 15 美元）以及在美国、加拿大、日本、新加坡或澳大利亚注册的 muse.ai 上的 Muse 账号。
    ja_JP: Dify で Meta Muse を利用：約 10 秒の音声付き動画（テキストから、セリフを話す写真から、既存動画の編集）、テキストや最大 9 枚の入力画像からの画像、Muse エージェントとのチャット。すべてご自身の Muse アカウントで動きます（無料プランも可）。複数の Muse アカウントを接続でき、メールを空欄にすると useapi.net が使用枠の残る正常なアカウントを選びます。useapi.net によるサードパーティ API で、Meta とは提携していません。useapi.net のサブスクリプション（月額 15 ドル）と、米国・カナダ・日本・シンガポール・オーストラリアで作成した muse.ai の Muse アカウントが必要です。
    pt_BR: 'Meta Muse no Dify: vídeos de cerca de 10 segundos com som (a partir de texto, de uma foto que fala uma fala ou de um vídeo para editar), imagens a partir de texto ou de até 9 imagens de entrada e chat com o agente Muse, na sua própria conta do Muse (o plano gratuito serve). Conecte várias contas do Muse: com o e-mail vazio, a useapi.net escolhe uma saudável com cota restante. API de terceiros da useapi.net, sem afiliação com a Meta. Requer assinatura da useapi.net (US$ 15/mês) e uma conta do Muse em muse.ai, criada nos EUA, Canadá, Japão, Singapura ou Austrália.'
