identity:
  name: chat
  author: useapi
  label:
    en_US: Muse chat
    zh_Hans: Muse 对话
    ja_JP: Muse とチャット
    pt_BR: Chat com o Muse
description:
  human:
    en_US: 'Talk to Muse, Meta''s AI agent: it answers, researches the web, writes documents and code, and makes images and videos. Start a chat or continue one.'
    zh_Hans: 与 Meta 的 AI 智能体 Muse 对话：它会回答问题、上网调研、写文档和代码，并生成图片和视频。可开始新对话或继续已有对话。
    ja_JP: Meta の AI エージェント Muse と会話：回答、Web 調査、ドキュメントやコードの作成、画像や動画の作成ができます。新しいチャットも続きも可能。
    pt_BR: 'Converse com o Muse, o agente de IA da Meta: ele responde, pesquisa na web, escreve documentos e código e cria imagens e vídeos. Comece ou continue um chat.'
  llm: 'Send a message to Muse, Meta''s AI agent at muse.ai (it talks, researches the web, writes and runs code, writes documents, makes images and videos). Without chat_id a new chat starts; with chat_id the message continues it. Give files as asset ids or workspace paths; Muse sees them as image_1, video_1, audio_1, file_1 in order. Returns Muse''s reply, the files it made (asset ids, attached as files), quick-reply options and any permission request: then ask the user and call answer_approval. Uses the account''s weekly Muse allowance.'
parameters:
- name: message
  type: string
  required: true
  label:
    en_US: Message
    zh_Hans: 消息
    ja_JP: メッセージ
    pt_BR: Mensagem
  human_description:
    en_US: What you say to Muse.
    zh_Hans: 你要对 Muse 说的话。
    ja_JP: Muse へのメッセージ。
    pt_BR: O que você diz ao Muse.
  llm_description: What to say to Muse, up to 5000 characters.
  form: llm
- name: chat_id
  type: string
  required: false
  label:
    en_US: Chat ID
    zh_Hans: 对话 ID
    ja_JP: チャット ID
    pt_BR: ID do chat
  human_description:
    en_US: 'Optional. Continue this chat. Empty: start a new chat.'
    zh_Hans: 可选。继续此对话。留空：开始新对话。
    ja_JP: 任意。このチャットを続けます。空欄なら新しいチャット。
    pt_BR: 'Opcional. Continua este chat. Vazio: começa um novo.'
  llm_description: Optional chat_id from an earlier chat or list_chats, to continue that chat. Leave empty for a new chat.
  form: llm
- name: files
  type: string
  required: false
  label:
    en_US: File asset IDs or paths
    zh_Hans: 文件资源 ID 或路径
    ja_JP: ファイルのアセット ID またはパス
    pt_BR: IDs ou caminhos de arquivos
  human_description:
    en_US: Optional asset ids (images, videos, audio, documents) or workspace paths, one per line.
    zh_Hans: 可选。资源 ID（图片、视频、音频、文档）或工作区路径，每行一个。
    ja_JP: 任意。アセット ID（画像・動画・音声・ドキュメント）またはワークスペースのパスを 1 行に 1 つ。
    pt_BR: IDs de ativos (imagens, vídeos, áudios, documentos) ou caminhos do workspace opcionais, um por linha.
  llm_description: 'Optional files for Muse, one per line: asset ids (up to 9 images, 3 videos, 3 audio) and document asset ids or workspace paths (up to 10). Muse sees them as image_1, video_1, audio_1, file_1 in this order. They must be on the chat''s account.'
  form: llm
- name: upload_files
  type: files
  required: false
  label:
    en_US: Files to upload
    zh_Hans: 要上传的文件
    ja_JP: アップロードするファイル
    pt_BR: Arquivos para enviar
  human_description:
    en_US: Optional image, video or audio files, uploaded to the chat's account and added after the ids (up to 50 MB each).
    zh_Hans: 可选。图片、视频或音频文件，会上传到对话所在账号并排在 ID 之后（每个最大 50 MB）。
    ja_JP: 任意。画像・動画・音声ファイル。チャットのアカウントにアップロードされ、ID の後に追加されます（各 50 MB まで）。
    pt_BR: Arquivos opcionais de imagem, vídeo ou áudio, enviados à conta do chat e adicionados depois dos IDs (até 50 MB cada).
  llm_description: Optional image, video or audio files, uploaded to Muse and added after the ids in files.
  form: llm
- name: email
  type: string
  required: false
  label:
    en_US: Muse account email
    zh_Hans: Muse 账号邮箱
    ja_JP: Muse アカウントのメール
    pt_BR: E-mail da conta do Muse
  human_description:
    en_US: 'Optional. Leave empty and useapi.net picks a healthy account with allowance left (or the account that holds the inputs). Default: the email in the credentials.'
    zh_Hans: 可选。留空时 useapi.net 会选择一个健康且有剩余额度的账号（或存放输入文件的账号）。默认：凭据中的邮箱。
    ja_JP: 任意。空欄にすると useapi.net が、使用枠が残っている正常なアカウント（または入力ファイルのあるアカウント）を選びます。既定は認証情報のメール。
    pt_BR: 'Opcional. Deixe vazio e a useapi.net escolhe uma conta saudável com cota restante (ou a conta que guarda as entradas). Padrão: o e-mail das credenciais.'
  llm_description: 'Optional Muse account email. Leave empty: useapi.net picks a healthy account with allowance left. Input asset ids already pin the request to their own account.'
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the answer
    zh_Hans: 等待回答
    ja_JP: 回答を待つ
    pt_BR: Aguardar a resposta
  human_description:
    en_US: Wait until Muse's answer ends or it asks for permission (up to the maximum wait).
    zh_Hans: 等待 Muse 回答结束或请求权限（不超过最长等待时间）。
    ja_JP: Muse の回答が終わるか許可を求めるまで待ちます（最大待機時間まで）。
    pt_BR: Aguarda a resposta do Muse terminar ou um pedido de permissão (até o tempo máximo).
  form: form
  default: true
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 120). Work still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 120）。仍在进行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 120）。実行中の処理は ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 120). O que ainda estiver em andamento é retornado com seu ID.
  form: form
  default: 120
  min: 10
  max: 420
- name: return_file
  type: boolean
  required: false
  label:
    en_US: Attach the files
    zh_Hans: 附加文件
    ja_JP: ファイルを添付
    pt_BR: Anexar os arquivos
  human_description:
    en_US: Download the files Muse made and return them as Dify files (up to 150 MB each).
    zh_Hans: 下载 Muse 生成的文件并作为 Dify 文件返回（每个最大 150 MB）。
    ja_JP: Muse が作ったファイルをダウンロードして Dify のファイルとして返します（各 150 MB まで）。
    pt_BR: Baixa os arquivos que o Muse fez e retorna como arquivos do Dify (até 150 MB cada).
  form: form
  default: true
