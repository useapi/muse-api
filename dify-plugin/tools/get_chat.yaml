identity:
  name: get_chat
  author: useapi
  label:
    en_US: Get Muse chat
    zh_Hans: 获取 Muse 对话
    ja_JP: Muse のチャットを取得
    pt_BR: Ver chat do Muse
description:
  human:
    en_US: 'Read a Muse chat: its status, Muse''s latest answer, the files it made and any permission request.'
    zh_Hans: 读取 Muse 对话：状态、Muse 的最新回答、生成的文件以及权限请求。
    ja_JP: Muse のチャットを読み取ります：状態、最新の回答、作成されたファイル、許可リクエスト。
    pt_BR: 'Lê um chat do Muse: status, a última resposta do Muse, os arquivos que ele fez e pedidos de permissão.'
  llm: 'Read a Muse chat: Muse''s answer to the latest user message, its files, quick replies and pending permission requests. With wait=true, waits until the running answer ends (up to max_wait). Use it after chat returned status running.'
parameters:
- name: chat_id
  type: string
  required: true
  label:
    en_US: Chat ID
    zh_Hans: 对话 ID
    ja_JP: チャット ID
    pt_BR: ID do chat
  human_description:
    en_US: The chat_id returned by Muse chat or List Muse chats.
    zh_Hans: “Muse 对话”或“列出 Muse 对话”返回的对话 ID。
    ja_JP: 「Muse とチャット」または「Muse のチャット一覧」で返された chat_id。
    pt_BR: O chat_id retornado por Chat com o Muse ou Listar chats do Muse.
  llm_description: The chat_id from chat or list_chats, e.g. c-u12345-email:john@gmail.com-chat:...-bot:muse.
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the answer
    zh_Hans: 等待回答
    ja_JP: 回答を待つ
    pt_BR: Aguardar a resposta
  human_description:
    en_US: Wait until the running answer ends (up to the maximum wait).
    zh_Hans: 等待正在进行的回答结束（不超过最长等待时间）。
    ja_JP: 実行中の回答が終わるまで待ちます（最大待機時間まで）。
    pt_BR: Aguarda a resposta em andamento terminar (até o tempo máximo).
  llm_description: true to wait until Muse's running answer ends.
  form: llm
  default: false
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 120). Work still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 120）。仍在进行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 120）。実行中の処理は ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 120). O que ainda estiver em andamento é retornado com seu ID.
