    en_US: Download the files Muse made and return them as Dify files (up to 150 MB each).
    zh_Hans: 下载 Muse 生成的文件并作为 Dify 文件返回（每个最大 150 MB）。
    ja_JP: Muse が作ったファイルをダウンロードして Dify のファイルとして返します（各 150 MB まで）。
    pt_BR: Baixa os arquivos que o Muse fez e retorna como arquivos do Dify (até 150 MB cada).
  form: form
  default: true
- name: reply_url
  type: string
  required: false
  label:
