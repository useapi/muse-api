    zh_Hans: 可选。通过 POST 接收完成后任务记录的公开 https 地址。
    ja_JP: 任意。完了したジョブの記録を POST で受け取る公開 https URL。
    pt_BR: URL https pública opcional que recebe o registro do job concluído via POST.
