    zh_Hans: Muse 账号邮箱
    ja_JP: Muse アカウントのメール
    pt_BR: E-mail da conta do Muse
  human_description:
    en_US: 'Optional. Leave empty and useapi.net picks a healthy account with allowance left (or the account that holds the inputs). Default: the email in the credentials.'
    zh_Hans: 可选。留空时 useapi.net 会选择一个健康且有剩余额度的账号（或存放输入文件的账号）。默认：凭据中的邮箱。
    ja_JP: 任意。空欄にすると useapi.net が、使用枠が残っている正常なアカウント（または入力ファイルのあるアカウント）を選びます。既定は認証情報のメール。
    pt_BR: 'Opcional. Deixe vazio e a useapi.net escolhe uma conta saudável com cota restante (ou a conta que guarda as entradas). Padrão: o e-mail das credenciais.'
  llm_description: 'Optional Muse account email. Leave empty: useapi.net picks a healthy account with allowance left. Input asset ids already pin the request to their own account.'
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the result
    zh_Hans: 等待结果
    ja_JP: 結果を待つ
    pt_BR: Aguardar o resultado
  human_description:
    en_US: 'Wait until the job finishes (up to the maximum wait). Off: return the job id at once.'
    zh_Hans: 等待任务完成（不超过最长等待时间）。关闭时立即返回任务 ID。
    ja_JP: ジョブの完了まで待ちます（最大待機時間まで）。オフにするとすぐにジョブ ID を返します。
    pt_BR: 'Aguarda o job terminar (até o tempo máximo). Desligado: retorna o ID do job na hora.'
  form: form
  default: true
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 120). Work still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 120）。仍在进行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 120）。実行中の処理は ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 120). O que ainda estiver em andamento é retornado com seu ID.
  form: form
