identity:
  name: generate_image
  author: useapi
  label:
    en_US: Generate image
    zh_Hans: 生成图片
    ja_JP: 画像を生成
    pt_BR: Gerar imagem
description:
  human:
    en_US: 'Make one image with Muse from a prompt, or from up to 9 input images: combine them, edit one, or restore and colorize an old photo.'
    zh_Hans: 用 Muse 根据提示词生成一张图片，或基于最多 9 张输入图片：合成、编辑，或修复并上色老照片。
    ja_JP: Muse でプロンプトから画像を 1 枚作成します。最大 9 枚の入力画像から合成、編集、古い写真の修復とカラー化も可能。
    pt_BR: 'Gera uma imagem com o Muse a partir de um prompt ou de até 9 imagens de entrada: combinar, editar ou restaurar e colorir uma foto antiga.'
  llm: Generate one Muse image (WebP). Text to image, or image to image with up to 9 inputs named image_1..image_9 in the prompt. Uses a little of the account's weekly Muse allowance (0 to 1 percent on the free plan). Waits up to max_wait, else returns a jobid for get_job.
parameters:
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
    ja_JP: プロンプト
    pt_BR: Prompt
  human_description:
    en_US: What the image shows. Name the input images as image_1, image_2.
    zh_Hans: 图片内容描述。用 image_1、image_2 指代输入图片。
    ja_JP: 画像の内容。入力画像は image_1、image_2 のように指定します。
    pt_BR: O que a imagem mostra. Cite as imagens de entrada como image_1, image_2.
  llm_description: 'What the image shows, up to 5000 characters. Muse makes one image (WebP, about 2 to 2.5 megapixels). Name the input images in the prompt as image_1, image_2.. in the order given, e.g. ''the person from image_2 wearing the jacket from image_1'', ''restore and colorize the old photo image_1''. Muse refuses to repeat a request the account already made: vary the prompt.'
  form: llm
