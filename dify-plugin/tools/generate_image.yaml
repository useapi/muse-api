- name: images
  type: string
  required: false
  label:
    en_US: Input image asset IDs
    zh_Hans: 输入图片资源 ID
    ja_JP: 入力画像のアセット ID
    pt_BR: IDs de imagens de entrada
  human_description:
    en_US: Optional asset ids of image files (from Upload, a job or the Library), one per line, up to 9. They become image_1, image_2.
    zh_Hans: 可选。图片文件的资源 ID（来自上传、任务或资料库），每行一个，最多 9 个。依次对应 image_1、image_2。
    ja_JP: 任意。画像ファイルのアセット ID（アップロード、ジョブ、ライブラリから）を 1 行に 1 つ、最大 9 件。順に image_1、image_2 になります。
    pt_BR: IDs de ativos opcionais de imagens (de Enviar, de um job ou da Biblioteca), um por linha, até 9. Viram image_1, image_2.
  llm_description: Optional image asset ids (user:...-email:<hex>-image:...), separated by new lines or commas, up to 9. They are named image_1, image_2.. in this order; name them so in the prompt. All inputs must be on one Muse account.
  form: llm
- name: image_files
  type: files
  required: false
  label:
    en_US: Input image files
    zh_Hans: 输入图片文件
    ja_JP: 入力画像ファイル
    pt_BR: Arquivos de imagens de entrada
  human_description:
    en_US: Optional. Or upload image files here (JPEG, PNG or WebP, up to 50 MB each). They come after the ids, up to 9 in all.
    zh_Hans: 可选。也可以在这里上传图片文件（JPEG、PNG 或 WebP，每个最大 50 MB）。排在 ID 之后，合计最多 9 个。
    ja_JP: 任意。画像ファイルをここでアップロードすることもできます（JPEG、PNG、WebP、各 50 MB まで）。ID の後に続き、合計 9 件まで。
    pt_BR: Opcional. Ou envie arquivos de imagem aqui (JPEG, PNG ou WebP, até 50 MB cada). Vêm depois dos IDs, até 9 no total.
  llm_description: Optional image files, uploaded to Muse and numbered after the ids (image_N), up to 9 in all.
  form: llm
- name: email
