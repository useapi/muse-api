    zh_Hans: 可选。在提示词前加上“In exactly <比例> aspect ratio”（Muse 没有比例参数）。提示词已写明比例时不添加。
    ja_JP: 任意。プロンプトに「In exactly <比率> aspect ratio」を加えます（Muse には比率の設定がありません）。プロンプトで比率を指定済みなら追加しません。
    pt_BR: Opcional. Acrescenta 'In exactly <proporção> aspect ratio' ao prompt (o Muse não tem ajuste de proporção). Ignorado quando o prompt já cita uma.
  llm_description: 'Optional aspect ratio; the plugin adds ''In exactly <ratio> aspect ratio'' to the prompt. One of: 1:1, 16:9, 9:16, 3:2, 2:3, 4:3, 3:4, 5:4, 4:5, 21:9.'
