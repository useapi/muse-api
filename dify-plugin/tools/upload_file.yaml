    pt_BR: Enviar arquivo ao Muse
description:
  human:
    en_US: Upload an image, video or audio file (or its public https URL) to a Muse account and get its asset id.
    zh_Hans: 把图片、视频或音频文件（或其公开 https 地址）上传到 Muse 账号，并获得资源 ID。
    ja_JP: 画像・動画・音声ファイル（または公開 https URL）を Muse アカウントにアップロードし、アセット ID を取得します。
    pt_BR: Envia um arquivo de imagem, vídeo ou áudio (ou sua URL https pública) para uma conta do Muse e retorna o ID do ativo.
  llm: Upload an image (JPEG, PNG, WebP), video (MP4, MOV, WebM) or audio file (MP3, WAV, M4A, OGG), up to 50 MB, to a Muse account. Returns the asset_id to pass as an input of the job and chat tools on the same account. Uses no allowance.
