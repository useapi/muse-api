# Generated by dev/gen_tools.py from dev/specs.py. Edit the specs, then re-run the generator.
identity:
  name: generate_video
  author: useapi
  label:
    en_US: Generate video
    zh_Hans: 生成视频
    ja_JP: 動画を生成
    pt_BR: Gerar vídeo
description:
  human:
    en_US: 'Make a video of about 10 seconds with sound with Muse: from text, animate a photo (it can speak a line), or edit a video with people from your images.'
    zh_Hans: 用 Muse 生成约 10 秒的有声视频：基于文本、让照片动起来（还能说出台词），或用你的图片中的人物编辑视频。
    ja_JP: Muse で約 10 秒の音声付き動画を作成：テキストから、写真を動かす（セリフも話せます）、画像の人物で動画を編集。
    pt_BR: 'Gera um vídeo de cerca de 10 segundos com som no Muse: a partir de texto, animando uma foto (ela pode falar uma fala) ou editando um vídeo com pessoas das suas imagens.'
  llm: 'Generate one Muse video, about 10 seconds, about 720p, with sound. Modes: text to video (no inputs); image to video and talking photos (image_1 plus a quoted line in the prompt); video to video edits (video_1, e.g. swap a person for someone from image_1). Inputs: up to 9 images, 3 videos and 3 audio files, named image_N, video_N, audio_N in the prompt. Uses 2 to 3 percent of the free plan''s weekly Muse allowance. Waits up to max_wait (default 180 s; videos take 60 to 140 s), else returns a jobid for get_job.'
parameters:
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
    ja_JP: プロンプト
    pt_BR: Prompt
  human_description:
    en_US: What the video shows. Name the inputs as image_1, video_1, audio_1. Lines in quotes are spoken.
    zh_Hans: 视频内容描述。用 image_1、video_1、audio_1 指代输入文件。引号中的台词会被说出来。
    ja_JP: 動画の内容。入力は image_1、video_1、audio_1 のように指定します。引用符内のセリフは話されます。
    pt_BR: O que o vídeo mostra. Cite as entradas como image_1, video_1, audio_1. Falas entre aspas são ditas.
  llm_description: 'What the video shows, up to 5000 characters. Muse makes one video of about 10 seconds with sound. Name the inputs in the prompt as image_1.., video_1.., audio_1.. in the order given; every name used must be given. Dialogue written in quotes is spoken (a talking photo: Animate image_1, she smiles and says "Hello!"). To edit a video: Edit video_1, replace the rider with the woman from image_1. Muse refuses to repeat a request the account already made: vary the prompt for each new video.'
  form: llm
- name: aspect_ratio
  type: select
  required: false
  label:
    en_US: Aspect ratio
    zh_Hans: 宽高比
    ja_JP: アスペクト比
    pt_BR: Proporção
  human_description:
    en_US: Optional. Adds 'In exactly <ratio> aspect ratio' to the prompt (Muse has no ratio setting). Skipped when the prompt already names one.
    zh_Hans: 可选。在提示词前加上“In exactly <比例> aspect ratio”（Muse 没有比例参数）。提示词已写明比例时不添加。
    ja_JP: 任意。プロンプトに「In exactly <比率> aspect ratio」を加えます（Muse には比率の設定がありません）。プロンプトで比率を指定済みなら追加しません。
    pt_BR: Opcional. Acrescenta 'In exactly <proporção> aspect ratio' ao prompt (o Muse não tem ajuste de proporção). Ignorado quando o prompt já cita uma.
  llm_description: 'Optional aspect ratio; the plugin adds ''In exactly <ratio> aspect ratio'' to the prompt. An image-to-video job keeps the start image''s shape unless a ratio is asked for. One of: 16:9, 9:16, 3:4.'
  form: llm
  options:
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
      ja_JP: '16:9'
      pt_BR: '16:9'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
      ja_JP: '9:16'
      pt_BR: '9:16'
  - value: '3:4'
    label:
      en_US: '3:4'
      zh_Hans: '3:4'
      ja_JP: '3:4'
      pt_BR: '3:4'
- name: images
  type: string
  required: false
  label:
    en_US: Input image asset IDs
    zh_Hans: 输入图片资源 ID
    ja_JP: 入力画像のアセット ID
    pt_BR: IDs de imagens de entrada
  human_description:
    en_US: Optional asset ids of image files (from Upload, a job or the Library), one per line, up to 9. They become image_1, image_2.
    zh_Hans: 可选。图片文件的资源 ID（来自上传、任务或资料库），每行一个，最多 9 个。依次对应 image_1、image_2。
    ja_JP: 任意。画像ファイルのアセット ID（アップロード、ジョブ、ライブラリから）を 1 行に 1 つ、最大 9 件。順に image_1、image_2 になります。
    pt_BR: IDs de ativos opcionais de imagens (de Enviar, de um job ou da Biblioteca), um por linha, até 9. Viram image_1, image_2.
  llm_description: Optional image asset ids (user:...-email:<hex>-image:...), separated by new lines or commas, up to 9. They are named image_1, image_2.. in this order; name them so in the prompt. All inputs must be on one Muse account.
  form: llm
- name: image_files
  type: files
  required: false
  label:
    en_US: Input image files
    zh_Hans: 输入图片文件
    ja_JP: 入力画像ファイル
    pt_BR: Arquivos de imagens de entrada
  human_description:
    en_US: Optional. Or upload image files here (JPEG, PNG or WebP, up to 50 MB each). They come after the ids, up to 9 in all.
    zh_Hans: 可选。也可以在这里上传图片文件（JPEG、PNG 或 WebP，每个最大 50 MB）。排在 ID 之后，合计最多 9 个。
    ja_JP: 任意。画像ファイルをここでアップロードすることもできます（JPEG、PNG、WebP、各 50 MB まで）。ID の後に続き、合計 9 件まで。
    pt_BR: Opcional. Ou envie arquivos de imagem aqui (JPEG, PNG ou WebP, até 50 MB cada). Vêm depois dos IDs, até 9 no total.
  llm_description: Optional image files, uploaded to Muse and numbered after the ids (image_N), up to 9 in all.
  form: llm
- name: videos
  type: string
  required: false
  label:
    en_US: Input video asset IDs
    zh_Hans: 输入视频资源 ID
    ja_JP: 入力動画のアセット ID
    pt_BR: IDs de vídeos de entrada
  human_description:
    en_US: Optional asset ids of video files (from Upload, a job or the Library), one per line, up to 3. They become video_1, video_2.
    zh_Hans: 可选。视频文件的资源 ID（来自上传、任务或资料库），每行一个，最多 3 个。依次对应 video_1、video_2。
    ja_JP: 任意。動画ファイルのアセット ID（アップロード、ジョブ、ライブラリから）を 1 行に 1 つ、最大 3 件。順に video_1、video_2 になります。
    pt_BR: IDs de ativos opcionais de vídeos (de Enviar, de um job ou da Biblioteca), um por linha, até 3. Viram video_1, video_2.
  llm_description: Optional video asset ids (user:...-email:<hex>-video:...), separated by new lines or commas, up to 3. They are named video_1, video_2.. in this order; name them so in the prompt. All inputs must be on one Muse account.
  form: llm
- name: video_files
  type: files
  required: false
  label:
    en_US: Input video files
    zh_Hans: 输入视频文件
    ja_JP: 入力動画ファイル
    pt_BR: Arquivos de vídeos de entrada
  human_description:
    en_US: Optional. Or upload video files here (MP4, MOV or WebM, up to 50 MB each). They come after the ids, up to 3 in all.
    zh_Hans: 可选。也可以在这里上传视频文件（MP4、MOV 或 WebM，每个最大 50 MB）。排在 ID 之后，合计最多 3 个。
    ja_JP: 任意。動画ファイルをここでアップロードすることもできます（MP4、MOV、WebM、各 50 MB まで）。ID の後に続き、合計 3 件まで。
    pt_BR: Opcional. Ou envie arquivos de vídeo aqui (MP4, MOV ou WebM, até 50 MB cada). Vêm depois dos IDs, até 3 no total.
  llm_description: Optional video files, uploaded to Muse and numbered after the ids (video_N), up to 3 in all.
  form: llm
- name: audio
  type: string
  required: false
  label:
    en_US: Input audio asset IDs
    zh_Hans: 输入音频资源 ID
    ja_JP: 入力音声のアセット ID
    pt_BR: IDs de áudios de entrada
  human_description:
    en_US: Optional asset ids of audio files (from Upload, a job or the Library), one per line, up to 3. They become audio_1, audio_2.
    zh_Hans: 可选。音频文件的资源 ID（来自上传、任务或资料库），每行一个，最多 3 个。依次对应 audio_1、audio_2。
    ja_JP: 任意。音声ファイルのアセット ID（アップロード、ジョブ、ライブラリから）を 1 行に 1 つ、最大 3 件。順に audio_1、audio_2 になります。
    pt_BR: IDs de ativos opcionais de áudios (de Enviar, de um job ou da Biblioteca), um por linha, até 3. Viram audio_1, audio_2.
  llm_description: Optional audio asset ids (user:...-email:<hex>-audio:...), separated by new lines or commas, up to 3. They are named audio_1, audio_2.. in this order; name them so in the prompt. All inputs must be on one Muse account.
  form: llm
- name: audio_files
  type: files
  required: false
  label:
    en_US: Input audio files
    zh_Hans: 输入音频文件
    ja_JP: 入力音声ファイル
    pt_BR: Arquivos de áudios de entrada
  human_description:
    en_US: Optional. Or upload audio files here (MP3, WAV, M4A or OGG, up to 50 MB each). They come after the ids, up to 3 in all.
    zh_Hans: 可选。也可以在这里上传音频文件（MP3、WAV、M4A 或 OGG，每个最大 50 MB）。排在 ID 之后，合计最多 3 个。
    ja_JP: 任意。音声ファイルをここでアップロードすることもできます（MP3、WAV、M4A、OGG、各 50 MB まで）。ID の後に続き、合計 3 件まで。
    pt_BR: Opcional. Ou envie arquivos de áudio aqui (MP3, WAV, M4A ou OGG, até 50 MB cada). Vêm depois dos IDs, até 3 no total.
  llm_description: Optional audio files, uploaded to Muse and numbered after the ids (audio_N), up to 3 in all.
  form: llm
- name: email
  type: string
  required: false
  label:
    en_US: Muse account email
    zh_Hans: Muse 账号邮箱
    ja_JP: Muse アカウントのメール
    pt_BR: E-mail da conta do Muse
  human_description:
    en_US: 'Optional. Leave empty and useapi.net picks a healthy account with allowance left (or the account that holds the inputs). Default: the email in the credentials.'
    zh_Hans: 可选。留空时 useapi.net 会选择一个健康且有剩余额度的账号（或存放输入文件的账号）。默认：凭据中的邮箱。
    ja_JP: 任意。空欄にすると useapi.net が、使用枠が残っている正常なアカウント（または入力ファイルのあるアカウント）を選びます。既定は認証情報のメール。
    pt_BR: 'Opcional. Deixe vazio e a useapi.net escolhe uma conta saudável com cota restante (ou a conta que guarda as entradas). Padrão: o e-mail das credenciais.'
  llm_description: 'Optional Muse account email. Leave empty: useapi.net picks a healthy account with allowance left. Input asset ids already pin the request to their own account.'
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the result
    zh_Hans: 等待结果
    ja_JP: 結果を待つ
    pt_BR: Aguardar o resultado
  human_description:
    en_US: 'Wait until the job finishes (up to the maximum wait). Off: return the job id at once.'
    zh_Hans: 等待任务完成（不超过最长等待时间）。关闭时立即返回任务 ID。
    ja_JP: ジョブの完了まで待ちます（最大待機時間まで）。オフにするとすぐにジョブ ID を返します。
    pt_BR: 'Aguarda o job terminar (até o tempo máximo). Desligado: retorna o ID do job na hora.'
  form: form
