- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 180). Work still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 180）。仍在进行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 180）。実行中の処理は ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 180). O que ainda estiver em andamento é retornado com seu ID.
  form: form
  default: 180
  min: 10
  max: 420
- name: return_file
  type: boolean
