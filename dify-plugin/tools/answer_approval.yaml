# Generated by dev/gen_tools.py from dev/specs.py. Edit the specs, then re-run the generator.
identity:
  name: answer_approval
  author: useapi
  label:
    en_US: Answer a Muse permission request
    zh_Hans: 答复 Muse 的权限请求
    ja_JP: Muse の許可リクエストに回答
    pt_BR: Responder a um pedido de permissão do Muse
description:
  human:
    en_US: Allow or deny what Muse asks permission for, for example sharing information with a website, then read the rest of its answer.
    zh_Hans: 允许或拒绝 Muse 请求的操作（例如向某个网站发送信息），然后读取它后续的回答。
    ja_JP: Muse が許可を求めている操作（Web サイトへの情報送信など）を許可または拒否し、続きの回答を読み取ります。
    pt_BR: Permite ou nega o que o Muse pede permissão para fazer (por exemplo, compartilhar dados com um site) e lê o resto da resposta.
  llm: 'Answer Muse''s permission request (status waiting_for_approval). allow_once: allow this one request; deny: refuse, Muse goes on without it. This plugin never grants a lasting permission. Ask the user first. Then waits for the rest of the answer.'
parameters:
- name: chat_id
  type: string
  required: true
  label:
    en_US: Chat ID
    zh_Hans: 对话 ID
    ja_JP: チャット ID
    pt_BR: ID do chat
  human_description:
    en_US: The chat_id returned by Muse chat or List Muse chats.
    zh_Hans: “Muse 对话”或“列出 Muse 对话”返回的对话 ID。
    ja_JP: 「Muse とチャット」または「Muse のチャット一覧」で返された chat_id。
    pt_BR: O chat_id retornado por Chat com o Muse ou Listar chats do Muse.
  llm_description: The chat_id from chat or list_chats, e.g. c-u12345-email:john@gmail.com-chat:...-bot:muse.
  form: llm
- name: approval_id
  type: string
  required: false
  label:
    en_US: Approval ID
    zh_Hans: 请求 ID
    ja_JP: リクエスト ID
    pt_BR: ID do pedido
  human_description:
    en_US: Optional when only one request waits in the chat.
    zh_Hans: 对话中只有一个待答复请求时可省略。
    ja_JP: チャットで待っているリクエストが 1 つだけなら省略できます。
    pt_BR: Opcional quando só um pedido aguarda no chat.
  llm_description: The approval_id from chat or get_chat. Optional when exactly one request waits.
  form: llm
- name: decision
  type: select
  required: true
  label:
    en_US: Decision
    zh_Hans: 决定
    ja_JP: 回答
    pt_BR: Decisão
  human_description:
    en_US: Allow once or deny.
    zh_Hans: 允许一次或拒绝。
    ja_JP: 1 回だけ許可、または拒否。
    pt_BR: Permitir uma vez ou negar.
  llm_description: allow_once or deny.
  form: llm
  options:
  - value: allow_once
    label:
      en_US: Allow once
      zh_Hans: 允许一次
      ja_JP: 1 回だけ許可
      pt_BR: Permitir uma vez
  - value: deny
    label:
      en_US: Deny
      zh_Hans: 拒绝
      ja_JP: 拒否
      pt_BR: Negar
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the answer
    zh_Hans: 等待回答
    ja_JP: 回答を待つ
    pt_BR: Aguardar a resposta
  human_description:
    en_US: Wait until Muse's answer ends or it asks for permission (up to the maximum wait).
    zh_Hans: 等待 Muse 回答结束或请求权限（不超过最长等待时间）。
    ja_JP: Muse の回答が終わるか許可を求めるまで待ちます（最大待機時間まで）。
    pt_BR: Aguarda a resposta do Muse terminar ou um pedido de permissão (até o tempo máximo).
  form: form
  default: true
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 120). Work still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 120）。仍在进行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 120）。実行中の処理は ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 120). O que ainda estiver em andamento é retornado com seu ID.
  form: form
  default: 120
  min: 10
  max: 420
- name: return_file
  type: boolean
  required: false
  label:
    en_US: Attach the files
    zh_Hans: 附加文件
    ja_JP: ファイルを添付
    pt_BR: Anexar os arquivos
  human_description:
    en_US: Download the files Muse made and return them as Dify files (up to 150 MB each).
    zh_Hans: 下载 Muse 生成的文件并作为 Dify 文件返回（每个最大 150 MB）。
    ja_JP: Muse が作ったファイルをダウンロードして Dify のファイルとして返します（各 150 MB まで）。
    pt_BR: Baixa os arquivos que o Muse fez e retorna como arquivos do Dify (até 150 MB cada).
  form: form
  default: true
output_schema:
  type: object
  properties:
    chat_id:
      type: string
    status:
      type: string
    reply:
      type: string
    asset_ids:
      type: array
      items:
        type: string
    approval_ids:
      type: array
      items:
        type: string
extra:
  python:
    source: tools/answer_approval.py
